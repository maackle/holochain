[package]
name = "kitsune2_sqlite_op_store"
version = "0.1.0"
description = "SQLite-based op store implementation for Kitsune2"
license = "Apache-2.0"
repository = "https://github.com/holochain/holochain"
documentation = "https://docs.rs/kitsune2_sqlite_op_store"
authors = ["Holochain Core Dev Team <devcore@holochain.org>"]
keywords = ["holochain", "kitsune2", "sqlite", "op-store", "p2p"]
categories = ["network-programming"]
edition = "2021"

[dependencies]
bytes = "1.10"
futures = "0.3"
holo_hash = { version = "^0.6.0-dev.10", path = "../holo_hash", features = [
  "kitsune2",
  "encoding",
  "hashing",
] }
holochain_serialized_bytes = "=0.0.56"
holochain_sqlite = { version = "^0.6.0-dev.17", path = "../holochain_sqlite" }
holochain_state = { version = "^0.6.0-dev.18", path = "../holochain_state" }
holochain_types = { version = "^0.6.0-dev.18", path = "../holochain_types" }
kitsune2_api = "0.2.15"
thiserror = "2.0"

[lints]
workspace = true
